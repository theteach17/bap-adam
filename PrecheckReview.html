<!DOCTYPE html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?><style>.review-shell{display:grid;grid-template-columns:minmax(0,64%) minmax(360px,36%);height:calc(100vh - 62px)}.pdf-pane{background:#eef2f7;padding:10px}.pdf-pane iframe{width:100%;height:100%;border:0;background:#fff}.review-pane{overflow:auto;padding:14px;background:#fff;border-left:1px solid var(--border)}.review-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}.review-item.prevfix{border-color:#f59e0b;background:#fffbeb}.result-buttons{display:flex;gap:6px;flex-wrap:wrap}.result-buttons button.active{outline:3px solid rgba(21,101,192,.25)}.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:12px}.tabbar button{border:0;background:transparent;padding:10px;font-weight:700;cursor:pointer}.tabbar button.active{border-bottom:3px solid var(--primary);color:var(--primary)}@media(max-width:1279px){.review-shell{display:block;height:auto}.pdf-pane,.review-pane{display:none}.review-shell.show-pdf .pdf-pane,.review-shell.show-review .review-pane{display:block;height:calc(100vh - 115px)}.mobile-tabs{display:flex!important}}@media(min-width:1280px){.mobile-tabs{display:none!important}}</style></head><body>
<div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span id="title" class="muted">ตรวจรายงาน</span><div class="spacer"></div><span id="saveState" class="save-state"></span><button id="openPdf" class="btn btn-secondary">เปิด PDF ในแท็บใหม่</button><button class="btn btn-secondary" onclick="nav('PrecheckOfficer')">กลับคิว</button></div>
<div class="mobile-tabs actions" style="padding:8px 12px;background:#fff"><button class="btn btn-secondary" onclick="mobileTab('pdf')">PDF</button><button class="btn btn-secondary" onclick="mobileTab('review')">Checklist</button></div>
<div id="shell" class="review-shell show-review"><div class="pdf-pane"><iframe id="pdfFrame" title="PDF Viewer"></iframe></div><div class="review-pane"><div id="lockNotice" class="notice hidden"></div><div id="takeoverBox" class="actions hidden" style="margin:8px 0"><button class="btn btn-danger" onclick="takeover()">Admin รับช่วงการตรวจ</button></div><div class="tabbar"><button id="tabChecklist" class="active" onclick="showTab('checklist')">Checklist</button><button id="tabData" onclick="showTab('data')">ข้อมูลรายงาน</button><button id="tabHistory" onclick="showTab('history')">ประวัติ</button></div>
<div id="checklistTab"><div class="actions"><label><input id="priorOnly" type="checkbox" onchange="renderItems()"> แสดงเฉพาะรายการที่ต้องแก้รอบก่อน</label></div><div id="items"></div><div class="field"><label>ความคิดเห็นทั่วไป</label><textarea id="generalComment" rows="3" oninput="queueSave()"></textarea></div><div class="actions" style="margin:16px 0"><button id="saveBtn" class="btn btn-secondary" onclick="flushSave(true)">บันทึก</button><button id="completeBtn" class="btn btn-primary" onclick="complete()">สรุปผลการตรวจ</button></div></div>
<div id="dataTab" class="hidden"><div id="structured"></div></div><div id="historyTab" class="hidden"><div id="history"></div></div></div></div>
<?!= include_('SharedScripts'); ?><script>
let submissionId='',data=null,responses={},dirty=false,saveTimer=null,saveInFlight=false,pending=false,currentItem=0;
window.addEventListener('load',()=>google.script.url.getLocation(async loc=>{submissionId=loc.parameter.submission||'';if(!submissionId){showToast('ไม่พบรหัสรายการ');return}await loadReview()}));
async function loadReview(){try{data=await server('openReview',submissionId);qs('title').textContent=`${data.submission.DocumentNumber} • V${data.version.VersionNo}`;qs('pdfFrame').src=data.pdfUrl||'';qs('openPdf').onclick=()=>window.open(data.pdfUrl,'_blank','noopener');responses=typeof data.review.ResponsesJSON==='string'?JSON.parse(data.review.ResponsesJSON||'{}'):(data.review.ResponsesJSON||{});qs('generalComment').value=data.review.GeneralComment||'';if(data.readOnly){qs('lockNotice').classList.remove('hidden');qs('lockNotice').textContent=`เอกสารนี้กำลังตรวจโดย ${data.lockedBy||'เจ้าหน้าที่อื่น'} คุณเปิดดูได้แบบอ่านอย่างเดียว`;if(data.canAdminTakeover)qs('takeoverBox').classList.remove('hidden');document.querySelectorAll('#checklistTab button,#checklistTab input,#checklistTab textarea').forEach(x=>x.disabled=true)}renderItems();renderStructured();renderHistory();qs('saveState').textContent=data.readOnly?'อ่านอย่างเดียว':'พร้อมบันทึก'}catch(e){showToast(e.message);qs('saveState').textContent=e.message}}
async function takeover(){if(!data||!data.canAdminTakeover)return;if(!confirm('ยืนยันรับช่วงการตรวจจากเจ้าหน้าที่คนปัจจุบัน? การดำเนินการนี้จะถูกบันทึก Audit'))return;try{await server('takeoverReview',data.review.ReviewId);location.reload()}catch(e){showToast(e.message)}}
function renderItems(){const only=qs('priorOnly').checked,prev=new Set((data.previousFixItemIds||[]).map(String));let rows=(data.items||[]).filter(i=>!only||prev.has(String(i.ItemId)));qs('items').innerHTML=rows.map((i,idx)=>{const r=responses[i.ItemId]||{result:'UNREVIEWED',issueSeverity:i.DefaultSeverity||'MINOR',comment:'',pageNumber:'',quickCommentIds:[]};const q=(data.quickComments||[]).filter(x=>!i.QuickCommentGroup||x.GroupId===i.QuickCommentGroup);return `<div class="review-item ${prev.has(String(i.ItemId))?'prevfix':''}" data-item="${esc(i.ItemId)}"><div><b>${esc(i.ItemLabel)}</b>${i.Required?' <span class="status danger">บังคับ</span>':''}</div>${i.HelpText?`<div class="muted">${esc(i.HelpText)}</div>`:''}<div class="result-buttons" style="margin-top:8px">${['PASS','FIX','NA','NOTE'].map(v=>`<button class="btn ${r.result===v?'active':''}" ${data.readOnly?'disabled':''} onclick="setResult('${esc(i.ItemId)}','${v}')">${v}</button>`).join('')}</div><div class="grid" style="margin-top:8px"><div class="field"><label>หน้า</label><input inputmode="numeric" value="${esc(r.pageNumber||'')}" ${data.readOnly?'disabled':''} onchange="setField('${esc(i.ItemId)}','pageNumber',this.value)"></div><div class="field"><label>ระดับ</label><select ${data.readOnly?'disabled':''} onchange="setField('${esc(i.ItemId)}','issueSeverity',this.value)"><option ${r.issueSeverity==='MINOR'?'selected':''}>MINOR</option><option ${r.issueSeverity==='CRITICAL'?'selected':''}>CRITICAL</option></select></div></div><div class="field" style="margin-top:8px"><label>Quick Comment</label><select ${data.readOnly?'disabled':''} onchange="setQuick('${esc(i.ItemId)}',this.value)"><option value="">-- เลือก --</option>${q.map(x=>`<option value="${esc(x.QuickCommentId)}">${esc(x.Label)}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><label>ความคิดเห็น</label><textarea rows="2" ${data.readOnly?'disabled':''} oninput="setField('${esc(i.ItemId)}','comment',this.value)">${esc(r.comment||'')}</textarea></div></div>`}).join('')||'<div class="muted">ไม่มีรายการตามตัวกรอง</div>'}
function ensure(id){if(!responses[id])responses[id]={result:'UNREVIEWED',issueSeverity:'MINOR',comment:'',pageNumber:'',quickCommentIds:[]};return responses[id]}
function setResult(id,v){ensure(id).result=v;dirty=true;renderItems();queueSave()}
function setField(id,k,v){ensure(id)[k]=v;queueSave()}
function setQuick(id,v){ensure(id).quickCommentIds=v?[v]:[];queueSave()}
function queueSave(){if(data&&data.readOnly)return;dirty=true;clearTimeout(saveTimer);qs('saveState').textContent='มีการเปลี่ยนแปลงที่ยังไม่บันทึก';saveTimer=setTimeout(()=>flushSave(false),2500)}
async function flushSave(manual){if(data.readOnly)return;if(saveInFlight){pending=true;return}if(!dirty&&!manual)return;saveInFlight=true;dirty=false;qs('saveState').innerHTML='<span class="loading"><span class="spinner"></span>กำลังบันทึก...</span>';try{const r=await server('saveReviewDraft',data.review.ReviewId,JSON.stringify(responses),qs('generalComment').value);qs('saveState').textContent='บันทึกแล้ว '+new Date(r.lastSavedAt).toLocaleTimeString('th-TH')}catch(e){dirty=true;qs('saveState').textContent='บันทึกไม่สำเร็จ';showToast(e.message);throw e}finally{saveInFlight=false;if(pending){pending=false;setTimeout(()=>flushSave(false),0)}}}
async function complete(){if(data.readOnly)return;const b=qs('completeBtn');b.disabled=true;try{await flushSave(true);const r=await server('completeReview',data.review.ReviewId,'DERIVE');showToast(r.decision==='REVISION_REQUIRED'?'ส่งกลับแก้ไขเรียบร้อย':'บันทึกผลการตรวจเรียบร้อย');setTimeout(()=>nav('PrecheckOfficer'),700)}catch(e){showToast(e.message);b.disabled=false}}
function renderStructured(){const v=data.version;const fields=[['AllocatedBudget','งบประมาณที่ได้รับจัดสรร'],['ActualBudget','งบประมาณที่ใช้จริง'],['ManagementXbar','X̄ ผลการบริหาร'],['ManagementSD','SD ผลการบริหาร'],['SatisfactionXbar','X̄ ความพึงพอใจ'],['SatisfactionSD','SD ความพึงพอใจ'],['ExpectedAchievementResult','ผลบรรลุผลที่คาดว่าจะได้รับ']];qs('structured').innerHTML=fields.map(([k,l])=>`<div class="card" style="box-shadow:none"><b>${esc(l)}</b><div class="muted">ค่าปัจจุบัน: ${esc(v[k]===undefined?'':v[k])}</div>${!data.readOnly?`<div class="grid" style="margin-top:8px"><input id="c_${k}" value="${esc(v[k]===undefined?'':v[k])}"><input id="r_${k}" placeholder="เหตุผลการแก้ไข"></div><button class="btn btn-secondary" style="margin-top:8px" onclick="correct('${k}')">บันทึกการแก้ไข</button>`:''}</div>`).join('')}
async function correct(k){try{const r=await server('correctStructuredData',data.submission.SubmissionId,data.version.VersionId,k,qs('c_'+k).value,qs('r_'+k).value);data.version[k]=r.value;showToast('บันทึกการแก้ไขแล้ว');renderStructured()}catch(e){showToast(e.message)}}
function renderHistory(){qs('history').innerHTML=(data.history||[]).map(h=>`<div class="notice ${h.Decision==='REVISION_REQUIRED'?'warn':''}" style="margin:8px 0"><b>${esc(h.Decision||'-')}</b> • ${esc(thDate(h.CompletedAt))}<div>${esc(h.ReviewerName||h.ReviewerEmail||'')}</div></div>`).join('')||'<div class="muted">ยังไม่มีประวัติ</div>'}
function showTab(t){['checklist','data','history'].forEach(x=>{qs(x+'Tab').classList.toggle('hidden',x!==t);qs('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===t)});if(t!=='checklist')flushSave(false)}
function mobileTab(t){qs('shell').className='review-shell show-'+(t==='pdf'?'pdf':'review')}
window.addEventListener('keydown',e=>{if(data&&data.readOnly)return;const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();flushSave(true);return}const map={'1':'PASS','2':'FIX','3':'NA','4':'NOTE'};if(map[e.key]){const cards=[...document.querySelectorAll('.review-item')];if(cards[currentItem])setResult(cards[currentItem].dataset.item,map[e.key]);}if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();const cards=[...document.querySelectorAll('.review-item')];currentItem=Math.min(cards.length-1,currentItem+1);cards[currentItem]?.scrollIntoView({behavior:'smooth',block:'center'})}});
</script></body></html>
