<!DOCTYPE html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?><style>.review-shell{display:grid;grid-template-columns:minmax(0,64%) minmax(360px,36%);height:calc(100vh - 62px)}.pdf-pane{background:#eef2f7;padding:10px}.pdf-pane iframe{width:100%;height:100%;border:0;background:#fff}.review-pane{overflow:auto;padding:14px;background:#fff;border-left:1px solid var(--border)}.review-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}.review-item.prevfix{border-color:#f59e0b;background:#fffbeb}.prior-feedback{margin-top:10px;padding:10px;border:1px solid #f59e0b;border-radius:10px;background:#fff7ed}.review-section{margin:16px 0 8px;padding:10px 12px;border-radius:10px;background:#eef6ff;border-left:4px solid var(--primary);font-weight:800}.review-item.subitem{margin-left:16px;border-left-width:3px}.review-item .item-number{font-weight:800}.checklist-summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.checklist-summary .status{font-size:12px}.checklist-summary.bottom{margin:14px 0 8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#f8fafc;align-items:center}.completion-footer{position:sticky;bottom:8px;z-index:30;margin:10px 0 14px;box-shadow:0 8px 24px rgba(15,23,42,.12)}.prior-feedback .prior-title{font-weight:700;color:#9a3412}.result-buttons{display:flex;gap:6px;flex-wrap:wrap}.result-buttons button.active{outline:3px solid rgba(21,101,192,.25)}.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:12px}.tabbar button{border:0;background:transparent;padding:10px;font-weight:700;cursor:pointer}.tabbar button.active{border-bottom:3px solid var(--primary);color:var(--primary)}@media(max-width:1279px){.review-shell{display:block;height:auto}.pdf-pane,.review-pane{display:none}.review-shell.show-pdf .pdf-pane,.review-shell.show-review .review-pane{display:block;height:calc(100vh - 115px)}.mobile-tabs{display:flex!important}}@media(min-width:1280px){.mobile-tabs{display:none!important}}</style></head><body>
<div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span id="title" class="muted">ตรวจรายงาน</span><div class="spacer"></div><span id="saveState" class="save-state"></span><button id="openPdf" class="btn btn-secondary">เปิด PDF ในแท็บใหม่</button><button class="btn btn-secondary" onclick="nav('PrecheckOfficer')">กลับคิว</button></div>
<div class="mobile-tabs actions" style="padding:8px 12px;background:#fff"><button class="btn btn-secondary" onclick="mobileTab('pdf')">PDF</button><button class="btn btn-secondary" onclick="mobileTab('review')">Checklist</button></div>
<div id="shell" class="review-shell show-review"><div class="pdf-pane"><iframe id="pdfFrame" title="PDF Viewer"></iframe></div><div class="review-pane"><div id="completionNotice" class="notice success hidden" style="margin-bottom:10px"></div><div id="lockNotice" class="notice hidden"></div><div id="takeoverBox" class="actions hidden" style="margin:8px 0"><button class="btn btn-danger" onclick="takeover()">Admin รับช่วงการตรวจ</button></div><div class="tabbar"><button id="tabChecklist" class="active" onclick="showTab('checklist')">Checklist</button><button id="tabData" onclick="showTab('data')">ข้อมูลรายงาน</button><button id="tabHistory" onclick="showTab('history')">ประวัติ</button></div>
<div id="checklistTab"><div id="checklistSummary" class="checklist-summary"></div><div id="previousReviewNotice" class="notice warn hidden" style="margin:8px 0"></div><div class="actions"><label><input id="priorOnly" type="checkbox" onchange="renderItems()"> แสดงเฉพาะรายการที่ต้องแก้รอบก่อน</label></div><div id="items"></div><div class="field"><label>ความคิดเห็นทั่วไป</label><textarea id="generalComment" rows="3" oninput="queueSave()"></textarea></div><div id="checklistSummaryBottom" class="checklist-summary bottom"></div><div class="actions" style="margin:10px 0 16px"><button id="saveBtn" class="btn btn-secondary" onclick="flushSave(true)">บันทึก</button><button id="completeBtn" class="btn btn-primary" onclick="complete()">สรุปผลการตรวจ</button></div></div><div id="completionFooterNotice" class="notice success completion-footer hidden"></div>
<div id="dataTab" class="hidden"><div id="structured"></div></div><div id="historyTab" class="hidden"><div id="history"></div></div></div></div>
<?!= include_('SharedScripts'); ?><script>
let submissionId='',data=null,responses={},dirty=false,saveTimer=null,saveInFlight=false,pending=false,currentItem=0;
function boolv(v){return v===true||String(v).toLowerCase()==='true'||String(v)==='1'}
window.addEventListener('load',()=>google.script.url.getLocation(async loc=>{submissionId=loc.parameter.submission||'';if(!submissionId){showToast('ไม่พบรหัสรายการ');return}await loadReview()}));
function toDrivePreviewUrl(url){const text=String(url||'').trim();if(!text)return'';let match=text.match(/\/file\/d\/([^/?#]+)/);if(!match)match=text.match(/[?&]id=([^&#]+)/);if(!match||!match[1])return text;return 'https://drive.google.com/file/d/'+match[1]+'/preview'}
async function loadReview(){try{data=await server('openReview',submissionId);qs('title').textContent=`${data.submission.DocumentNumber} • V${data.version.VersionNo}`;qs('pdfFrame').src=toDrivePreviewUrl(data.pdfUrl);qs('openPdf').onclick=()=>window.open(data.pdfUrl,'_blank','noopener');responses=typeof data.review.ResponsesJSON==='string'?JSON.parse(data.review.ResponsesJSON||'{}'):(data.review.ResponsesJSON||{});qs('generalComment').value=data.review.GeneralComment||'';if(data.readOnly){qs('lockNotice').classList.remove('hidden');qs('lockNotice').textContent=`เอกสารนี้กำลังตรวจโดย ${data.lockedBy||'เจ้าหน้าที่อื่น'} คุณเปิดดูได้แบบอ่านอย่างเดียว`;if(data.canAdminTakeover)qs('takeoverBox').classList.remove('hidden');document.querySelectorAll('#checklistTab button,#checklistTab input,#checklistTab textarea').forEach(x=>x.disabled=true)}renderPreviousReviewNotice();renderItems();renderStructured();renderHistory();qs('saveState').textContent=data.readOnly?'อ่านอย่างเดียว':'พร้อมบันทึก'}catch(e){showToast(e.message);qs('saveState').textContent=e.message}}
async function takeover(){if(!data||!data.canAdminTakeover)return;if(!confirm('ยืนยันรับช่วงการตรวจจากเจ้าหน้าที่คนปัจจุบัน? การดำเนินการนี้จะถูกบันทึก Audit'))return;try{await server('takeoverReview',data.review.ReviewId);location.reload()}catch(e){showToast(e.message)}}
function renderPreviousReviewNotice(){const box=qs('previousReviewNotice'),p=data.previousReview,ids=data.previousFixItemIds||[];if(!p||!ids.length){box.classList.add('hidden');box.innerHTML='';return}const who=p.reviewerName||p.reviewerEmail||'ผู้ตรวจรอบก่อน';box.classList.remove('hidden');box.innerHTML=`<b>ตรวจฉบับแก้ไข V${esc(data.version.VersionNo)}</b> • มีรายการ FIX จาก V${esc(p.versionNo)} จำนวน ${ids.length} รายการ<div class="muted" style="margin-top:4px">ผู้ตรวจรอบก่อน: ${esc(who)}${p.completedAt?` • ${esc(thDate(p.completedAt))}`:''}</div>${p.generalComment?`<div style="margin-top:6px"><b>ความคิดเห็นทั่วไปรอบก่อน:</b> ${esc(p.generalComment)}</div>`:''}`}
function previousFeedbackHtml(itemId){const p=(data.previousFixDetails||{})[String(itemId)];if(!p)return'';const quick=(p.quickCommentIds||[]).map(id=>{const q=(data.quickComments||[]).find(x=>String(x.QuickCommentId)===String(id));return q?(q.Label||q.Text||''):''}).filter(Boolean);return `<div class="prior-feedback"><div class="prior-title">ข้อสังเกตรอบก่อน (V${esc((data.previousReview||{}).versionNo||'')}) — FIX</div><div style="margin-top:4px">${p.pageNumber?`หน้า ${esc(p.pageNumber)} • `:''}ระดับ ${esc(p.issueSeverity||'MINOR')}</div>${quick.length?`<div style="margin-top:4px"><b>Quick Comment:</b> ${quick.map(esc).join(', ')}</div>`:''}${p.comment?`<div style="margin-top:4px"><b>ความคิดเห็น:</b> ${esc(p.comment)}</div>`:'<div class="muted" style="margin-top:4px">ไม่มีความคิดเห็นข้อความเพิ่มเติม</div>'}</div>`}
function reviewItemHtml(i,prev){
  const r=responses[i.ItemId]||{result:'UNREVIEWED',issueSeverity:i.DefaultSeverity||'MINOR',comment:'',pageNumber:'',quickCommentIds:[]};
  const q=(data.quickComments||[]).filter(x=>!i.QuickCommentGroup||x.GroupId===i.QuickCommentGroup);
  const isSub=Number(i.SubsectionOrder||1)>1;
  const resultButtons=['PASS','FIX','NA','NOTE'].map(v=>{
    const forbiddenNA=v==='NA'&&!boolv(i.AllowNA);
    const disabled=data.readOnly||forbiddenNA;
    const title=forbiddenNA?'รายการนี้ไม่อนุญาตให้เลือก N/A':'';
    return `<button class="btn ${r.result===v?'active':''}" ${disabled?'disabled':''} ${title?`title="${esc(title)}"`:''} onclick="setResult('${esc(i.ItemId)}','${v}')">${v}</button>`;
  }).join('');
  return `<div class="review-item ${prev.has(String(i.ItemId))?'prevfix':''} ${isSub?'subitem':''}" data-item="${esc(i.ItemId)}"><div><b class="item-number">${esc(i.ItemLabel)}</b>${boolv(i.Required)?' <span class="status danger">บังคับ</span>':''}${boolv(i.AllowNA)?' <span class="status">N/A ได้</span>':''}</div>${i.HelpText?`<div class="muted">${esc(i.HelpText)}</div>`:''}${previousFeedbackHtml(i.ItemId)}<div class="result-buttons" style="margin-top:8px">${resultButtons}</div><div class="grid" style="margin-top:8px"><div class="field"><label>หน้า</label><input inputmode="numeric" value="${esc(r.pageNumber||'')}" ${data.readOnly?'disabled':''} onchange="setField('${esc(i.ItemId)}','pageNumber',this.value)"></div><div class="field"><label>ระดับ</label><select ${data.readOnly?'disabled':''} onchange="setField('${esc(i.ItemId)}','issueSeverity',this.value)"><option ${r.issueSeverity==='MINOR'?'selected':''}>MINOR</option><option ${r.issueSeverity==='CRITICAL'?'selected':''}>CRITICAL</option></select></div></div><div class="field" style="margin-top:8px"><label>Quick Comment</label><select ${data.readOnly?'disabled':''} onchange="setQuick('${esc(i.ItemId)}',this.value)"><option value="">-- เลือก --</option>${q.map(x=>`<option value="${esc(x.QuickCommentId)}">${esc(x.Label)}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><label>ความคิดเห็น</label><textarea rows="2" ${data.readOnly?'disabled':''} oninput="setField('${esc(i.ItemId)}','comment',this.value)">${esc(r.comment||'')}</textarea></div></div>`;
}
function renderItems(){
  const only=qs('priorOnly').checked,prev=new Set((data.previousFixItemIds||[]).map(String));
  const rows=(data.items||[]).filter(i=>!only||prev.has(String(i.ItemId)));
  const counts={total:(data.items||[]).length,reviewed:0,fix:0,note:0};
  (data.items||[]).forEach(i=>{const r=responses[i.ItemId]||{};if(r.result&&r.result!=='UNREVIEWED')counts.reviewed++;if(r.result==='FIX')counts.fix++;if(r.result==='NOTE')counts.note++});
  const summaryHtml=`<span class="status">ตรวจแล้ว ${counts.reviewed}/${counts.total}</span><span class="status ${counts.fix?'danger':'ok'}">FIX ${counts.fix}</span><span class="status">NOTE ${counts.note}</span>${data.version&&Number(data.version.VersionNo)>1?`<span class="status">V${esc(data.version.VersionNo)}</span>`:''}`;qs('checklistSummary').innerHTML=summaryHtml;qs('checklistSummaryBottom').innerHTML=summaryHtml;
  if(!rows.length){qs('items').innerHTML='<div class="muted">ไม่มีรายการตามตัวกรอง</div>';return}
  let html='',sectionKey='';
  rows.forEach(i=>{
    const key=String(i.SectionOrder||'')+'|'+String(i.SectionTitle||'');
    if(key!==sectionKey){sectionKey=key;html+=`<div class="review-section">${esc(i.SectionTitle||'การตรวจรายงาน')}</div>`}
    html+=reviewItemHtml(i,prev);
  });
  qs('items').innerHTML=html;
}
function ensure(id){if(!responses[id])responses[id]={result:'UNREVIEWED',issueSeverity:'MINOR',comment:'',pageNumber:'',quickCommentIds:[]};return responses[id]}
function setResult(id,v){ensure(id).result=v;dirty=true;renderItems();queueSave()}
function setField(id,k,v){ensure(id)[k]=v;queueSave()}
function setQuick(id,v){ensure(id).quickCommentIds=v?[v]:[];queueSave()}
function queueSave(){if(data&&data.readOnly)return;dirty=true;clearTimeout(saveTimer);setSaveState('saveState','มีการเปลี่ยนแปลงที่ยังไม่บันทึก','dirty');saveTimer=setTimeout(()=>flushSave(false),2500)}
async function flushSave(manual){if(data.readOnly)return;if(saveInFlight){pending=true;return}if(!dirty&&!manual)return;saveInFlight=true;dirty=false;setSaveState('saveState','กำลังบันทึก...','saving');try{const r=await server('saveReviewDraft',data.review.ReviewId,JSON.stringify(responses),qs('generalComment').value);setSaveState('saveState','บันทึกแล้ว '+new Date(r.lastSavedAt).toLocaleTimeString('th-TH'),'saved');if(manual)showSuccess('บันทึกผลการตรวจเรียบร้อยแล้ว')}catch(e){dirty=true;setSaveState('saveState','บันทึกไม่สำเร็จ','error');showError(e.message);throw e}finally{saveInFlight=false;if(pending){pending=false;setTimeout(()=>flushSave(false),0)}}}
async function complete(){if(data.readOnly)return;const b=qs('completeBtn');b.disabled=true;b.textContent='กำลังสรุปผล...';try{await flushSave(true);const r=await server('completeReview',data.review.ReviewId,'DERIVE');const msg=r.decision==='REVISION_REQUIRED'?'สรุปผลสำเร็จ — ส่งกลับให้ผู้รับผิดชอบแก้ไขแล้ว':'สรุปผลสำเร็จ — รายงานผ่านการตรวจแล้ว';const actionHtml=`<b>${esc(msg)}</b><div class="muted" style="margin-top:4px">กรุณาเลือกขั้นตอนต่อไป</div><div class="actions" style="margin-top:8px"><button class="btn btn-primary" onclick="nav('PrecheckOfficer')">กลับหน้าคิวตรวจ</button><button class="btn btn-secondary" onclick="nav('Index')">หน้าหลัก</button></div>`;const box=qs('completionNotice');box.innerHTML=actionHtml;box.classList.remove('hidden');const footer=qs('completionFooterNotice');footer.innerHTML=actionHtml;footer.classList.remove('hidden');document.querySelectorAll('#checklistTab button,#checklistTab input,#checklistTab textarea,#checklistTab select').forEach(el=>el.disabled=true);setSaveState('saveState','สรุปผลแล้ว','saved');b.textContent='สรุปผลแล้ว';showSuccess(msg+' กรุณาเลือกขั้นตอนต่อไป',6500);setTimeout(()=>{try{footer.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(_){footer.scrollIntoView()}},80)}catch(e){showError(e.message);b.disabled=false;b.textContent='สรุปผลการตรวจ'}}
function renderStructured(){const v=data.version;const fields=[['AllocatedBudget','งบประมาณที่ได้รับจัดสรร'],['ActualBudget','งบประมาณที่ใช้จริง'],['SatisfactionXbar','X̄ ความพึงพอใจ'],['SatisfactionSD','SD ความพึงพอใจ'],['ManagementXbar','X̄ ผลการบริหาร'],['ManagementSD','SD ผลการบริหาร'],['ExpectedAchievementResult','บรรลุผลที่คาดว่าจะได้รับ']];qs('structured').innerHTML=fields.map(([k,l])=>`<div class="card" style="box-shadow:none"><b>${esc(l)}</b><div class="muted">ค่าปัจจุบัน: ${esc(v[k]===undefined?'':v[k])}</div>${!data.readOnly?`<div class="grid" style="margin-top:8px"><input id="c_${k}" value="${esc(v[k]===undefined?'':v[k])}"><input id="r_${k}" placeholder="เหตุผลการแก้ไข"></div><button class="btn btn-secondary" style="margin-top:8px" onclick="correct('${k}')">บันทึกการแก้ไข</button>`:''}</div>`).join('')}
async function correct(k){try{const r=await server('correctStructuredData',data.submission.SubmissionId,data.version.VersionId,k,qs('c_'+k).value,qs('r_'+k).value);data.version[k]=r.value;showToast('บันทึกการแก้ไขแล้ว');renderStructured()}catch(e){showToast(e.message)}}
function renderHistory(){qs('history').innerHTML=(data.history||[]).map(h=>`<div class="notice ${h.Decision==='REVISION_REQUIRED'?'warn':''}" style="margin:8px 0"><b>${esc(h.Decision||'-')}</b> • ${esc(thDate(h.CompletedAt))}<div>${esc(h.ReviewerName||h.ReviewerEmail||'')}</div></div>`).join('')||'<div class="muted">ยังไม่มีประวัติ</div>'}
function showTab(t){['checklist','data','history'].forEach(x=>{qs(x+'Tab').classList.toggle('hidden',x!==t);qs('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===t)});if(t!=='checklist')flushSave(false)}
function mobileTab(t){qs('shell').className='review-shell show-'+(t==='pdf'?'pdf':'review')}
window.addEventListener('keydown',e=>{if(data&&data.readOnly)return;const tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();flushSave(true);return}const map={'1':'PASS','2':'FIX','3':'NA','4':'NOTE'};if(map[e.key]){const cards=[...document.querySelectorAll('.review-item')];if(cards[currentItem])setResult(cards[currentItem].dataset.item,map[e.key]);}if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();const cards=[...document.querySelectorAll('.review-item')];currentItem=Math.min(cards.length-1,currentItem+1);cards[currentItem]?.scrollIntoView({behavior:'smooth',block:'center'})}});
</script></body></html>
