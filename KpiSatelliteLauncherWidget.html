<style>
#kpiSatOverlay{position:fixed;inset:0;z-index:2600;background:#eef3f8;display:none;flex-direction:column}#kpiSatOverlay.open{display:flex}.kpiSatTop{height:58px;background:#173b66;color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;box-shadow:0 2px 12px rgba(0,0,0,.12)}.kpiSatTop strong{font-size:1rem}.kpiSatStatus{margin-left:auto;font-size:.78rem;opacity:.95;display:flex;align-items:center;gap:7px}.kpiSatDot{width:9px;height:9px;border-radius:50%;background:#ffd166}.kpiSatClose{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:9px;padding:7px 10px}.kpiSatBody{position:relative;flex:1;min-height:0}.kpiSatFrame{border:0;width:100%;height:100%;display:block;background:#f3f6fb}.kpiSatGate{position:absolute;inset:0;z-index:2;background:#f3f6fb;display:flex;align-items:center;justify-content:center}.kpiSatCard{width:min(660px,92vw);background:#fff;border-radius:18px;padding:24px;border:1px solid #e3eaf2;box-shadow:0 14px 50px rgba(30,62,95,.15)}.kpiSatSteps{margin-top:16px;display:grid;gap:8px}.kpiSatStep{padding:9px 11px;border-radius:10px;background:#f6f8fb;color:#5d6b79;font-size:.83rem}.kpiSatStep.active{background:#e7f0ff;color:#174a82}.kpiSatStep.done{background:#e6f4ea;color:#146c43}.kpiSatStep.error{background:#f8d7da;color:#842029}.kpiSatActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.kpiSatRetry,.kpiSatTransport{display:none;border:0;border-radius:10px;color:#fff;padding:9px 14px}.kpiSatRetry{background:#245da8}.kpiSatTransport{background:#64748b}.kpiSatErrorDetail{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff4f4;color:#842029;font-size:.78rem;line-height:1.5;border:1px solid #f3c2c7}
</style>
<div id="kpiSatOverlay" aria-hidden="true"><div class="kpiSatTop"><i class="fas fa-chart-line"></i><strong>ประสิทธิภาพการตรวจรายงาน</strong><div class="kpiSatStatus"><span class="kpiSatDot" id="kpiSatDot"></span><span id="kpiSatStatusText">กำลังเตรียมระบบ</span></div><button class="kpiSatClose" onclick="closeKpiSatelliteDashboard()"><i class="fas fa-times"></i></button></div><div class="kpiSatBody"><div class="kpiSatGate" id="kpiSatGate"><div class="kpiSatCard"><h5 style="margin:0;color:#173b66">กำลังเปิด KPI Satellite</h5><div style="color:#6f7d8a;margin-top:5px;font-size:.86rem">ระบบจะแจ้งทุกขั้นตอนและจะไม่ส่งงานวิเคราะห์ผ่านบัญชีหลัก</div><div class="kpiSatSteps"><div class="kpiSatStep" id="ks1">1. ตรวจสิทธิ์ PRECHECK_ADMIN</div><div class="kpiSatStep" id="ks2">2. สร้าง Secure Handoff</div><div class="kpiSatStep" id="ks3">3. เชื่อมต่อ budgetservice KPI Satellite</div><div class="kpiSatStep" id="ks4">4. ยืนยันสิทธิ์กับฐาน PC_Access</div><div class="kpiSatStep" id="ks5">5. โหลดและประมวลผล Dashboard</div></div><div id="kpiSatErrorDetail" class="kpiSatErrorDetail"></div><div class="kpiSatActions"><button class="kpiSatRetry" id="kpiSatRetry" onclick="openKpiSatelliteDashboard(true)">ลองอีกครั้ง</button><button class="kpiSatTransport" id="kpiSatTransport" onclick="openKpiSatelliteTransportCheck()">ตรวจ Transport โดยตรง</button></div></div></div><iframe id="kpiSatFrame" class="kpiSatFrame" title="Project Adam KPI Satellite" sandbox="allow-scripts allow-forms allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals" referrerpolicy="no-referrer"></iframe></div></div>
<script>
(function(){
  let state={channel:'',ticket:'',timer:null,probeTimer:null,frame:null,url:'',frameLoaded:false,ready:false};
  function step(n,cls){let e=document.getElementById('ks'+n);if(e)e.className='kpiSatStep '+(cls||'');}
  function status(t,kind){document.getElementById('kpiSatStatusText').textContent=t;document.getElementById('kpiSatDot').style.background=kind==='error'?'#ff6b6b':kind==='ready'?'#69db7c':'#ffd166';}
  function clearTimers(){if(state.timer)clearTimeout(state.timer);if(state.probeTimer)clearTimeout(state.probeTimer);state.timer=null;state.probeTimer=null;}
  function fail(msg,code){
    status('เกิดข้อผิดพลาด','error');
    [1,2,3,4,5].forEach(n=>{let e=document.getElementById('ks'+n);if(e&&e.classList.contains('active'))e.className='kpiSatStep error';});
    clearTimers();
    const retry=document.getElementById('kpiSatRetry'),transport=document.getElementById('kpiSatTransport'),detail=document.getElementById('kpiSatErrorDetail');
    retry.style.display='inline-block';transport.style.display=state.url?'inline-block':'none';detail.style.display='block';
    detail.textContent=(code?'['+code+'] ':'')+(msg||'กรุณาลองอีกครั้ง');
    if(window.Swal)Swal.fire({icon:'error',title:'เปิด KPI Dashboard ไม่สำเร็จ',text:(code?'['+code+'] ':'')+(msg||'กรุณาลองอีกครั้ง')});
  }
  function channel(){try{return crypto.randomUUID();}catch(e){return 'kpi-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}
  function srcWithChannel(url,ch){return url+(url.indexOf('?')>=0?'&':'?')+'embed=1#channel='+encodeURIComponent(ch);}
  window.openKpiSatelliteTransportCheck=function(){if(state.url)window.open(state.url,'_blank','noopener,noreferrer');};
  window.openKpiSatelliteDashboard=function(){
    let o=document.getElementById('kpiSatOverlay');o.classList.add('open');o.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    document.getElementById('kpiSatGate').style.display='flex';document.getElementById('kpiSatRetry').style.display='none';document.getElementById('kpiSatTransport').style.display='none';document.getElementById('kpiSatErrorDetail').style.display='none';
    [1,2,3,4,5].forEach(n=>step(n,''));step(1,'active');status('กำลังตรวจสิทธิ์ Admin');
    clearTimers();state.ready=false;state.frameLoaded=false;state.url='';state.ticket='';state.channel='';
    state.frame=document.getElementById('kpiSatFrame');state.frame.onload=function(){
      if(state.frame.src==='about:blank')return;state.frameLoaded=true;
      if(!state.ready){status('หน้า Satellite ตอบสนองแล้ว กำลังรอ Secure Handshake');state.probeTimer=setTimeout(function(){if(!state.ready)status('หน้า Satellite ถูกโหลด แต่ยังไม่ได้รับ READY — กำลังตรวจ Transport');},3500);}
    };state.frame.src='about:blank';
    google.script.run.withSuccessHandler(function(r){
      step(1,'done');step(2,'done');step(3,'active');status('กำลังเชื่อมต่อ KPI Satellite');
      state.channel=channel();state.ticket=r.ticket;state.url=r.url;state.frame.src=srcWithChannel(r.url,state.channel);
      state.timer=setTimeout(function(){
        if(state.ready)return;
        let reason=state.frameLoaded?'หน้า Satellite/Google auth ถูกโหลด แต่ไม่สามารถเริ่ม Secure Handshake ได้':'เบราว์เซอร์ไม่สามารถโหลด KPI Satellite ใน iframe ได้';
        fail(reason+' โปรดตรวจว่า Satellite deployment ใช้ Execute as Me และสิทธิ์ Transport แบบไม่ต้องผ่าน Google Sign-in (ANYONE_ANONYMOUS).','SATELLITE_TRANSPORT_AUTH_BLOCKED');
      },12000);
    }).withFailureHandler(e=>fail((e&&e.message)||String(e),'MAIN_BRIDGE_ERROR')).getKpiSatelliteLaunchTicket();
  };
  window.closeKpiSatelliteDashboard=function(){let o=document.getElementById('kpiSatOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow='';clearTimers();state.ticket='';state.channel='';state.url='';if(state.frame)state.frame.src='about:blank';};
  window.addEventListener('message',function(ev){
    if(!state.frame||ev.source!==state.frame.contentWindow)return;let d=ev.data||{};if(d.source!=='PROJECT_ADAM_KPI_SATELLITE'||d.channel!==state.channel)return;
    if(d.type==='READY'){
      state.ready=true;clearTimers();step(3,'done');step(4,'active');status('Satellite พร้อม กำลังยืนยันสิทธิ์ PRECHECK_ADMIN');
      ev.source.postMessage({source:'PROJECT_ADAM_MAIN',type:'HANDOFF',channel:state.channel,ticket:state.ticket},'*');state.ticket='';
      state.timer=setTimeout(()=>fail('Satellite ตอบ READY แล้ว แต่การยืนยัน Handoff ใช้เวลานานเกินกำหนด','SATELLITE_HANDOFF_TIMEOUT'),15000);return;
    }
    if(d.type==='AUTH_OK'){clearTimers();step(4,'done');step(5,'active');status('ยืนยันสิทธิ์แล้ว กำลังโหลด Dashboard');state.timer=setTimeout(()=>fail('ยืนยันสิทธิ์สำเร็จ แต่ Dashboard โหลดไม่เสร็จภายในเวลาที่กำหนด','SATELLITE_DASHBOARD_TIMEOUT'),30000);return;}
    if(d.type==='STAGE'){status(d.message||'กำลังดำเนินการ',d.error?'error':'');if(d.error)fail(d.message,d.stage||'SATELLITE_ERROR');return;}
    if(d.type==='DASHBOARD_READY'){clearTimers();step(5,'done');status('พร้อมใช้งาน','ready');document.getElementById('kpiSatGate').style.display='none';return;}
    if(d.type==='REQUEST_CLOSE'){closeKpiSatelliteDashboard();return;}
    if(d.type==='ERROR'){fail(d.message||'KPI Satellite error','SATELLITE_ERROR');}
  });
})();
</script>
