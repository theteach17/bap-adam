<style>
#kpiSatOverlay{position:fixed;inset:0;z-index:2600;background:#eef3f8;display:none;flex-direction:column}#kpiSatOverlay.open{display:flex}.kpiSatTop{height:58px;background:#173b66;color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;box-shadow:0 2px 12px rgba(0,0,0,.12)}.kpiSatTop strong{font-size:1rem}.kpiSatStatus{margin-left:auto;font-size:.78rem;opacity:.95;display:flex;align-items:center;gap:7px}.kpiSatDot{width:9px;height:9px;border-radius:50%;background:#ffd166}.kpiSatClose{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:9px;padding:7px 10px}.kpiSatBody{position:relative;flex:1;min-height:0}.kpiSatFrame{border:0;width:100%;height:100%;display:block;background:#f3f6fb}.kpiSatGate{position:absolute;inset:0;z-index:2;background:#f3f6fb;display:flex;align-items:center;justify-content:center}.kpiSatCard{width:min(620px,92vw);background:#fff;border-radius:18px;padding:24px;border:1px solid #e3eaf2;box-shadow:0 14px 50px rgba(30,62,95,.15)}.kpiSatSteps{margin-top:16px;display:grid;gap:8px}.kpiSatStep{padding:9px 11px;border-radius:10px;background:#f6f8fb;color:#5d6b79;font-size:.83rem}.kpiSatStep.active{background:#e7f0ff;color:#174a82}.kpiSatStep.done{background:#e6f4ea;color:#146c43}.kpiSatStep.error{background:#f8d7da;color:#842029}.kpiSatRetry{display:none;margin-top:14px;border:0;border-radius:10px;background:#245da8;color:white;padding:9px 14px}
</style>
<div id="kpiSatOverlay" aria-hidden="true"><div class="kpiSatTop"><i class="fas fa-chart-line"></i><strong>ประสิทธิภาพการตรวจรายงาน</strong><div class="kpiSatStatus"><span class="kpiSatDot" id="kpiSatDot"></span><span id="kpiSatStatusText">กำลังเตรียมระบบ</span></div><button class="kpiSatClose" onclick="closeKpiSatelliteDashboard()"><i class="fas fa-times"></i></button></div><div class="kpiSatBody"><div class="kpiSatGate" id="kpiSatGate"><div class="kpiSatCard"><h5 style="margin:0;color:#173b66">กำลังเปิด KPI Satellite</h5><div style="color:#6f7d8a;margin-top:5px;font-size:.86rem">ระบบจะแจ้งทุกขั้นตอนและจะไม่ส่งงานวิเคราะห์ผ่านบัญชีหลัก</div><div class="kpiSatSteps"><div class="kpiSatStep" id="ks1">1. ตรวจสิทธิ์ PRECHECK_ADMIN</div><div class="kpiSatStep" id="ks2">2. สร้าง Secure Handoff</div><div class="kpiSatStep" id="ks3">3. เชื่อมต่อ budgetservice KPI Satellite</div><div class="kpiSatStep" id="ks4">4. ยืนยันสิทธิ์กับฐาน PC_Access</div><div class="kpiSatStep" id="ks5">5. โหลดและประมวลผล Dashboard</div></div><button class="kpiSatRetry" id="kpiSatRetry" onclick="openKpiSatelliteDashboard(true)">ลองอีกครั้ง</button></div></div><iframe id="kpiSatFrame" class="kpiSatFrame" title="Project Adam KPI Satellite" sandbox="allow-scripts allow-forms allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" referrerpolicy="no-referrer"></iframe></div></div>
<script>
(function(){let state={channel:'',ticket:'',timer:null,frame:null};function step(n,cls){let e=document.getElementById('ks'+n);if(e)e.className='kpiSatStep '+(cls||'');}function status(t,kind){document.getElementById('kpiSatStatusText').textContent=t;document.getElementById('kpiSatDot').style.background=kind==='error'?'#ff6b6b':kind==='ready'?'#69db7c':'#ffd166';}function fail(msg){status('เกิดข้อผิดพลาด','error');[1,2,3,4,5].forEach(n=>{let e=document.getElementById('ks'+n);if(e.classList.contains('active'))e.className='kpiSatStep error';});document.getElementById('kpiSatRetry').style.display='inline-block';if(state.timer)clearTimeout(state.timer);if(window.Swal)Swal.fire({icon:'error',title:'เปิด KPI Dashboard ไม่สำเร็จ',text:msg||'กรุณาลองอีกครั้ง'});}function channel(){try{return crypto.randomUUID();}catch(e){return 'kpi-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}function srcWithChannel(url,ch){return url+(url.indexOf('?')>=0?'&':'?')+'embed=1#channel='+encodeURIComponent(ch);}window.openKpiSatelliteDashboard=function(retry){let o=document.getElementById('kpiSatOverlay');o.classList.add('open');o.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('kpiSatGate').style.display='flex';document.getElementById('kpiSatRetry').style.display='none';[1,2,3,4,5].forEach(n=>step(n,''));step(1,'active');status('กำลังตรวจสิทธิ์ Admin');state.frame=document.getElementById('kpiSatFrame');state.frame.src='about:blank';google.script.run.withSuccessHandler(function(r){step(1,'done');step(2,'done');step(3,'active');status('กำลังเชื่อมต่อ KPI Satellite');state.channel=channel();state.ticket=r.ticket;state.frame.src=srcWithChannel(r.url,state.channel);state.timer=setTimeout(()=>fail('KPI Satellite ไม่ตอบกลับภายในเวลาที่กำหนด'),20000);}).withFailureHandler(e=>fail((e&&e.message)||String(e))).getKpiSatelliteLaunchTicket();};window.closeKpiSatelliteDashboard=function(){let o=document.getElementById('kpiSatOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow='';if(state.timer)clearTimeout(state.timer);state.ticket='';state.channel='';document.getElementById('kpiSatFrame').src='about:blank';};window.addEventListener('message',function(ev){if(!state.frame||ev.source!==state.frame.contentWindow)return;let d=ev.data||{};if(d.source!=='PROJECT_ADAM_KPI_SATELLITE'||d.channel!==state.channel)return;if(d.type==='READY'){step(3,'done');step(4,'active');status('กำลังยืนยันสิทธิ์กับ KPI Satellite');ev.source.postMessage({source:'PROJECT_ADAM_MAIN',type:'HANDOFF',channel:state.channel,ticket:state.ticket},'*');state.ticket='';return;}if(d.type==='AUTH_OK'){step(4,'done');step(5,'active');status('กำลังโหลด Dashboard');return;}if(d.type==='STAGE'){status(d.message||'กำลังดำเนินการ',d.error?'error':'');if(d.error)fail(d.message);return;}if(d.type==='DASHBOARD_READY'){step(5,'done');status('พร้อมใช้งาน','ready');document.getElementById('kpiSatGate').style.display='none';if(state.timer)clearTimeout(state.timer);return;}if(d.type==='REQUEST_CLOSE'){closeKpiSatelliteDashboard();return;}if(d.type==='ERROR'){fail(d.message||'KPI Satellite error');}});})();
</script>
