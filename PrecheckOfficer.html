<!DOCTYPE html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?></head><body>
<div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span class="muted">งานตรวจเอกสาร</span><div class="spacer"></div><button class="btn btn-secondary" onclick="nav('Index')">หน้าหลัก</button></div><div class="container">
<div id="kpis" class="kpis"></div><div class="card"><div class="grid3"><div class="field"><label>ปีเอกสาร</label><input id="year"></div><div class="field"><label>สถานะ</label><select id="status"><option value="">ทั้งหมด</option><option>WAITING_REVIEW</option><option>IN_REVIEW</option><option>WAITING_REVIEW_REVISED</option><option>REVISION_REQUIRED</option><option>APPROVED_COMMITTED</option><option>APPROVED_COMMIT_FAILED</option></select></div><div class="field"><label>กลุ่มบริหาร</label><input id="adminGroup"></div><div class="field"><label>กลุ่มงาน</label><input id="workGroup"></div><div class="field"><label>ผู้รับผิดชอบ</label><input id="owner"></div><div class="field"><label>ผู้ตรวจ</label><input id="reviewer"></div><div class="field"><label>ตั้งแต่วันที่</label><input id="dateFrom" type="date"></div><div class="field"><label>ถึงวันที่</label><input id="dateTo" type="date"></div><div class="field"><label><input id="revisedOnly" type="checkbox"> เฉพาะฉบับแก้ไข</label></div></div><div class="actions" style="margin-top:14px"><button class="btn btn-primary" id="searchBtn" onclick="go(1)">ค้นหา</button></div></div>
<div class="card"><div id="state" class="muted"></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>เอกสาร</th><th>กลุ่มงาน</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>Version</th><th>ผู้ตรวจ</th><th>SLA</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions" style="justify-content:center;margin-top:14px"><button id="prev" class="btn btn-secondary">ก่อนหน้า</button><span id="pageText"></span><button id="next" class="btn btn-secondary">ถัดไป</button></div></div></div><?!= include_('SharedScripts'); ?><script>
let currentPage=1;
window.addEventListener('load',()=>go(1));
function filters(){return{year:qs('year').value,status:qs('status').value,adminGroup:qs('adminGroup').value,workGroup:qs('workGroup').value,owner:qs('owner').value,reviewer:qs('reviewer').value,dateFrom:qs('dateFrom').value,dateTo:qs('dateTo').value,revisedOnly:qs('revisedOnly').checked}}
async function go(page){currentPage=page;qs('searchBtn').disabled=true;qs('state').innerHTML='<span class="loading"><span class="spinner"></span>กำลังโหลดคิว...</span>';try{const d=await server('getOfficerDashboard',filters(),page),k=d.kpi;qs('kpis').innerHTML=[['รอตรวจ',k.waiting],['กำลังตรวจ',k.inReview],['ส่งฉบับแก้ไขแล้ว',k.revisedWaiting],['ต้องแก้ไข',k.revisionRequired],['ผ่านและบันทึกแล้ว',k.committed],['ตรวจแล้วทั้งหมด',k.reviewedTotal]].map(x=>`<div class="kpi"><span class="muted">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');qs('state').textContent=`พบ ${d.total} รายการ`;qs('rows').innerHTML=d.items.map(r=>`<tr><td><b>${esc(r.documentNumber)}</b><div>${esc(r.documentName)}</div></td><td>${esc(r.adminGroup)}<div class="muted">${esc(r.workGroup)}</div></td><td>${esc(r.owner)}</td><td><span class="status ${statusClass(r.status)}">${esc(r.status)}</span></td><td>V${esc(r.currentVersion)}</td><td>${esc(r.reviewer||'-')}</td><td>${r.slaState?`<span class="status ${r.slaState==='OVER'?'danger':r.slaState==='NEAR'?'warn':''}">${esc(r.slaLabel||r.slaState)}</span>`:'-'}</td><td>${['WAITING_REVIEW','WAITING_REVIEW_REVISED','IN_REVIEW'].includes(r.status)?`<button class="btn btn-primary" onclick="nav('PrecheckReview',{submission:'${esc(r.submissionId)}'})">ตรวจ</button>`:`<button class="btn btn-secondary" onclick="nav('PrecheckDetail',{submission:'${esc(r.submissionId)}'})">ดู</button>`}</td></tr>`).join('');qs('pageText').textContent=`หน้า ${d.page} / ${d.totalPages}`;qs('prev').disabled=d.page<=1;qs('next').disabled=d.page>=d.totalPages;qs('prev').onclick=()=>go(d.page-1);qs('next').onclick=()=>go(d.page+1)}catch(e){qs('state').textContent=e.message;showToast(e.message)}finally{qs('searchBtn').disabled=false}}
</script></body></html>
