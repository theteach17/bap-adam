<!DOCTYPE html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?></head><body>
<div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span class="muted">รายละเอียดเอกสาร</span><div class="spacer"></div><button class="btn btn-secondary" onclick="nav('MyDocuments')">รายการของฉัน</button><button class="btn btn-secondary" onclick="nav('Index')">หน้าหลัก</button></div>
<div class="container"><div id="loading" class="card"><span class="loading"><span class="spinner"></span>กำลังโหลด...</span></div><div id="content" class="hidden">
<div class="card"><div class="actions" style="justify-content:space-between"><div><h2 id="docNo" style="margin:0"></h2><div id="docName" class="muted"></div></div><span id="status" class="status"></span></div><div id="meta" class="grid3" style="margin-top:16px"></div><div class="actions" style="margin-top:16px"><button id="reviseBtn" class="btn btn-primary hidden">ส่งฉบับแก้ไข</button><button id="allBtn" class="btn btn-secondary" onclick="toggleAll()">ดูผลการตรวจทั้งหมด</button></div></div>
<div class="card"><h3 style="margin-top:0">ผลการตรวจ</h3><div id="results"></div></div>
<div class="card"><h3 style="margin-top:0">Version และประวัติ</h3><div class="table-wrap"><table><thead><tr><th>Version</th><th>สถานะ</th><th>อัปโหลด</th><th>ไฟล์</th><th>ข้อมูลฉบับ</th></tr></thead><tbody id="versions"></tbody></table></div><div id="versionDetail" class="version-detail hidden"></div><div id="history" style="margin-top:16px"></div></div>
</div></div><?!= include_('SharedScripts'); ?><script>
let submissionId='',showAll=false,detailData=null;
window.addEventListener('load',()=>google.script.url.getLocation(async loc=>{submissionId=loc.parameter.submission||'';if(!submissionId){showError('ไม่พบรหัสรายการ');return}await load()}));
async function load(){try{const d=await server('getMyDocumentDetail',submissionId,showAll),s=d.submission;detailData=d;qs('loading').classList.add('hidden');qs('content').classList.remove('hidden');qs('docNo').textContent=s.DocumentNumber;qs('docName').textContent=s.DocumentNameSnapshot;qs('status').textContent=s.Status;qs('status').className='status '+statusClass(s.Status);qs('meta').innerHTML=[['เลขอ้างอิง',s.CaseNo],['ผู้รับผิดชอบ',s.ResponsiblePersonSnapshot],['กลุ่มบริหาร',s.AdminGroupSnapshot],['กลุ่มงาน',s.WorkGroupSnapshot],['Version ปัจจุบัน','V'+(s.CurrentVersion||'-')],['อัปเดตล่าสุด',thDate(s.UpdatedAt)]].map(x=>`<div><div class="muted">${esc(x[0])}</div><b>${esc(x[1]||'-')}</b></div>`).join('');qs('reviseBtn').classList.toggle('hidden',s.Status!=='REVISION_REQUIRED'||!d.canEdit);qs('reviseBtn').onclick=()=>nav('SubmitDocument',{document:s.DocumentNumber});renderResults(d.responses||[]);qs('versions').innerHTML=(d.versions||[]).map(v=>`<tr><td><b>V${esc(v.VersionNo)}</b></td><td><span class="status ${statusClass(v.VersionStatus)}">${esc(v.VersionStatus)}</span></td><td>${esc(thDate(v.UploadedAt))}</td><td>${v.FileUrl?`<a href="${esc(v.FileUrl)}" target="_blank" rel="noopener">เปิด PDF</a>`:'-'}</td><td><button class="btn btn-secondary" onclick="showVersionDetail(${Number(v.VersionNo)||0})">ดูข้อมูล V${esc(v.VersionNo)}</button></td></tr>`).join('');qs('history').innerHTML=(d.reviews||[]).map(r=>`<div class="notice ${r.Decision==='REVISION_REQUIRED'?'warn':''}" style="margin:8px 0"><b>${esc(r.Decision||'-')}</b> • ${esc(thDate(r.CompletedAt))} • ${esc(r.ReviewerName||r.ReviewerEmail||'')}</div>`).join('')||'<span class="muted">ยังไม่มีผลการตรวจ</span>';}catch(e){qs('loading').textContent=e.message;showError(e.message)}}
function renderResults(rows){if(!rows.length){qs('results').innerHTML='<div class="muted">ไม่มีรายการที่ต้องแสดง</div>';return}qs('results').innerHTML=rows.map(r=>`<div class="${r.Result==='FIX'?'fix-item':r.Result==='NOTE'?'note-item':'notice'}"><div><b>${r.PageNumber?'หน้า '+esc(r.PageNumber)+' — ':''}${esc(r.ItemLabel||r.ItemId)}</b> <span class="status ${statusClass(r.Result)}">${esc(r.Result)}</span></div>${r.Comment?`<div style="margin-top:6px">${esc(r.Comment)}</div>`:''}${(r.QuickCommentTexts||[]).map(q=>`<div class="muted" style="margin-top:4px">• ${esc(q)}</div>`).join('')}</div>`).join('')}
function showVersionDetail(versionNo){const v=(detailData&&detailData.versions||[]).find(x=>Number(x.VersionNo)===Number(versionNo));if(!v)return;const fields=[['หมายเหตุการแก้ไขฉบับนี้',v.ChangeNote],['เป้าหมายเชิงปริมาณ',v.QuantitativeTarget],['ผลของเป้าหมายเชิงปริมาณ',v.QuantitativeResult],['เป้าหมายเชิงคุณภาพ',v.QualitativeTarget],['ผลของเป้าหมายเชิงคุณภาพ',v.QualitativeResult],['ผลที่คาดว่าจะได้รับ',v.ExpectedTarget],['บรรลุผลที่คาดว่าจะได้รับ',v.ExpectedAchievementResult],['X̄ ความพึงพอใจ',v.SatisfactionXbar],['SD ความพึงพอใจ',v.SatisfactionSD],['X̄ ผลการบริหารกิจกรรม',v.ManagementXbar],['SD ผลการบริหารกิจกรรม',v.ManagementSD],['งบประมาณที่ได้รับจัดสรร',v.AllocatedBudget],['งบประมาณที่ใช้จริง',v.ActualBudget],['ชื่อไฟล์ที่อัปโหลด',v.OriginalFileName||v.StoredFileName],['อัปโหลดเมื่อ',thDate(v.UploadedAt)]];const box=qs('versionDetail');box.classList.remove('hidden');box.innerHTML=`<div class="actions" style="justify-content:space-between"><h4 style="margin:0">ข้อมูล V${esc(v.VersionNo)} <span class="status ${statusClass(v.VersionStatus)}">${esc(v.VersionStatus)}</span></h4><button class="btn btn-secondary" onclick="qs('versionDetail').classList.add('hidden')">ปิด</button></div><div class="grid" style="margin-top:12px">${fields.map(([k,val])=>`<div><div class="muted" style="font-size:.84rem">${esc(k)}</div><div style="white-space:pre-wrap;font-weight:600">${esc(val===undefined||val===null||val===''?'-':val)}</div></div>`).join('')}</div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function toggleAll(){showAll=!showAll;qs('allBtn').textContent=showAll?'แสดงเฉพาะรายการที่ต้องแก้ไข':'ดูผลการตรวจทั้งหมด';await load()}
</script></body></html>
