<!DOCTYPE html><html lang="th"><head><base target="_top"><script>window.__PC_BASE_URL=<?!= pcBaseUrlLiteral_() ?>;</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?></head><body>
<div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span class="muted">รายการเอกสารของฉัน</span><div class="spacer"></div><button class="btn btn-primary" onclick="nav('SubmitDocument')">ส่งเอกสาร</button><button class="btn btn-secondary" onclick="nav('Index')">หน้าหลัก</button></div>
<div class="container"><div class="card"><div class="actions"><div class="field"><label>ปีเอกสาร</label><input id="year" inputmode="numeric" style="width:130px"></div><div class="field"><label>สถานะ</label><select id="status"><option value="">ทั้งหมด</option><option>DRAFT</option><option>WAITING_REVIEW</option><option>IN_REVIEW</option><option>REVISION_REQUIRED</option><option>WAITING_REVIEW_REVISED</option><option>APPROVED_PENDING_COMMIT</option><option>APPROVED_COMMITTING</option><option>APPROVED_COMMITTED</option><option>APPROVED_COMMIT_FAILED</option></select></div><button id="searchBtn" class="btn btn-primary" onclick="loadDocs()">ค้นหา</button></div></div>
<div class="card"><div id="state" class="muted">กำลังโหลด...</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>เลขเอกสาร</th><th>ชื่อเอกสาร</th><th>Version</th><th>สถานะ</th><th>อัปเดต</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<?!= include_('SharedScripts'); ?><script>
window.addEventListener('load',loadDocs);
async function loadDocs(){const b=qs('searchBtn');b.disabled=true;qs('state').innerHTML='<span class="loading"><span class="spinner"></span>กำลังโหลดรายการ...</span>';try{const rows=await server('getMyDocuments',{year:qs('year').value,status:qs('status').value});qs('state').textContent=rows.length?`พบ ${rows.length} รายการ`:'ยังไม่มีรายการ';qs('rows').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.documentNumber)}</b><div class="muted">${esc(r.caseNo||'')}</div></td><td>${esc(r.documentName)}</td><td>V${esc(r.currentVersion||'-')}</td><td><span class="status ${statusClass(r.status)}">${esc(r.status)}</span></td><td>${esc(thDate(r.updatedAt))}</td><td><div class="actions"><button class="btn btn-secondary" onclick="nav('PrecheckDetail',{submission:'${esc(r.submissionId)}'})">ดูรายละเอียด</button>${['DRAFT','REVISION_REQUIRED'].includes(r.status)?`<button class="btn btn-primary" onclick="nav('SubmitDocument',{document:'${esc(r.documentNumber)}'})">${r.status==='REVISION_REQUIRED'?'ส่งฉบับแก้ไข':'ทำรายการต่อ'}</button>`:''}</div></td></tr>`).join('')}catch(e){qs('state').textContent=e.message;showToast(e.message)}finally{b.disabled=false}}
</script></body></html>
