<!DOCTYPE html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศูนย์สารสนเทศกลาง</title><?!= include_('SharedStyles'); ?></head><body><div class="top"><div class="brand">ศูนย์สารสนเทศกลาง</div><span class="muted">จัดการแบบตรวจและสิทธิ์</span><div class="spacer"></div><button class="btn btn-secondary" onclick="nav('PrecheckOfficer')">คิวตรวจ</button><button class="btn btn-secondary" onclick="nav('Index')">หน้าหลัก</button></div><div class="container"><div id="state" class="card">กำลังโหลด...</div><div id="content" class="hidden">
<div class="card"><h3 style="margin-top:0">แบบตรวจ</h3><div id="templates"></div></div>
<div class="card"><h3 style="margin-top:0">เพิ่ม/แก้รายการตรวจในแบบร่าง</h3><div class="grid3"><div class="field"><label>Template ID</label><input id="tiTemplate"></div><div class="field"><label>Item ID (เว้นว่างเพื่อเพิ่ม)</label><input id="tiItem"></div><div class="field"><label>รายการตรวจ</label><input id="tiLabel"></div><div class="field"><label>Section</label><input id="tiSection" value="การตรวจรายงาน"></div><div class="field"><label>ลำดับ Section</label><input id="tiSectionOrder" value="1"></div><div class="field"><label>ลำดับรายการ</label><input id="tiOrder" value="1"></div><div class="field"><label><input id="tiRequired" type="checkbox"> Required</label></div><div class="field"><label><input id="tiNA" type="checkbox"> Allow N/A</label></div><div class="field"><label>Subsection</label><input id="tiSubsection"></div><div class="field"><label>Help text</label><input id="tiHelp"></div><div class="field"><label>Severity</label><select id="tiSeverity"><option>MINOR</option><option>CRITICAL</option></select></div><div class="field"><label>Quick Comment Group</label><input id="tiGroup" value="GENERAL"></div><div class="field"><label><input id="tiActive" type="checkbox" checked> Active</label></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="saveItem()">บันทึกรายการ</button></div>
<div class="card"><h3 style="margin-top:0">Quick Comments</h3><div id="quickList"></div><div class="grid3" style="margin-top:12px"><div class="field"><label>ID (เว้นว่างเพื่อเพิ่ม)</label><input id="qcId"></div><div class="field"><label>Group</label><input id="qcGroup" value="GENERAL"></div><div class="field"><label>Label</label><input id="qcLabel"></div><div class="field"><label>ข้อความเต็ม</label><input id="qcText"></div><div class="field"><label>ลำดับ</label><input id="qcOrder" value="1"></div><div class="field"><label><input id="qcActive" type="checkbox" checked> Active</label></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="saveQuick()">บันทึก Quick Comment</button></div>
<div class="card"><h3 style="margin-top:0">สิทธิ์เจ้าหน้าที่</h3><div id="access"></div><div class="grid3" style="margin-top:12px"><div class="field"><label>Email</label><input id="aEmail" type="email"></div><div class="field"><label>Role</label><select id="aRole"><option>PRECHECK_OFFICER</option><option>PRECHECK_ADMIN</option></select></div><div class="field"><label>ชื่อแสดงผล</label><input id="aName"></div><div class="field"><label><input id="aActive" type="checkbox" checked> Active</label></div></div><button class="btn btn-primary" style="margin-top:12px" onclick="saveAccess()">บันทึกสิทธิ์</button></div>
</div></div><?!= include_('SharedScripts'); ?><script>
let adminData=null;window.addEventListener('load',load);
async function load(){try{adminData=await server('getTemplateAdminData');qs('state').classList.add('hidden');qs('content').classList.remove('hidden');render()}catch(e){qs('state').textContent=e.message;showToast(e.message)}}
function render(){qs('templates').innerHTML=(adminData.templates||[]).map(t=>`<div class="notice" style="margin:8px 0"><b>${esc(t.TemplateName)} v${esc(t.TemplateVersion)}</b> <span class="status ${t.Status==='PUBLISHED'?'ok':''}">${esc(t.Status)}</span><div class="muted">${esc(t.TemplateId)} • ${esc(t.AcademicYearFrom||'')}–${esc(t.AcademicYearTo||'')}</div><div class="actions" style="margin-top:8px"><button class="btn btn-secondary" data-id="${esc(t.TemplateId)}" data-name="${esc(t.TemplateName)}" onclick="cloneT(this.dataset.id,this.dataset.name)">Clone</button>${t.Status==='DRAFT'?`<button class="btn btn-success" data-id="${esc(t.TemplateId)}" onclick="publishT(this.dataset.id)">Publish</button>`:''}${t.Status!=='RETIRED'?`<button class="btn btn-secondary" data-id="${esc(t.TemplateId)}" onclick="retireT(this.dataset.id)">Retire</button>`:''}</div></div>`).join('');qs('quickList').innerHTML=(adminData.quickComments||[]).map(q=>`<div>${esc(q.GroupId)} • <b>${esc(q.Label)}</b> — ${esc(q.FullText)} ${q.Active?'':'(inactive)'}</div>`).join('')||'<span class="muted">ยังไม่มีข้อมูล</span>';qs('access').innerHTML=(adminData.access||[]).map(a=>`<div>${esc(a.Email)} • ${esc(a.Role)} • ${a.Active?'Active':'Inactive'}</div>`).join('')||'<span class="muted">ยังไม่มีข้อมูล</span>'}
async function cloneT(id,name){const n=prompt('ชื่อแบบตรวจใหม่',name+' (ฉบับใหม่)');if(!n)return;try{await server('cloneTemplate',id,n);showToast('สร้างแบบร่างใหม่แล้ว');await load()}catch(e){showToast(e.message)}}
async function publishT(id){if(!confirm('ยืนยัน Publish แบบตรวจนี้? เมื่อถูกใช้งานแล้วต้องแก้ด้วยการ Clone เป็น Version ใหม่'))return;try{await server('publishTemplate',id);showToast('เผยแพร่แล้ว');await load()}catch(e){showToast(e.message)}}
async function retireT(id){if(!confirm('ยืนยันยุติการใช้แบบตรวจนี้สำหรับรายการใหม่? รายการเดิมจะยังใช้ Template เดิม'))return;try{await server('retireTemplate',id);showToast('ยุติการใช้แบบตรวจแล้ว');await load()}catch(e){showToast(e.message)}}
async function saveItem(){try{await server('upsertTemplateItem',qs('tiTemplate').value,{itemId:qs('tiItem').value,itemLabel:qs('tiLabel').value,sectionTitle:qs('tiSection').value,sectionOrder:qs('tiSectionOrder').value,subsectionOrder:1,subsectionTitle:qs('tiSubsection').value,itemOrder:qs('tiOrder').value,helpText:qs('tiHelp').value,required:qs('tiRequired').checked,allowNA:qs('tiNA').checked,quickCommentGroup:qs('tiGroup').value,defaultSeverity:qs('tiSeverity').value,active:qs('tiActive').checked});showToast('บันทึกรายการแล้ว');await load()}catch(e){showToast(e.message)}}
async function saveQuick(){try{await server('upsertQuickComment',{quickCommentId:qs('qcId').value,groupId:qs('qcGroup').value,label:qs('qcLabel').value,fullText:qs('qcText').value,active:qs('qcActive').checked,sortOrder:qs('qcOrder').value});showToast('บันทึก Quick Comment แล้ว');await load()}catch(e){showToast(e.message)}}
async function saveAccess(){try{await server('upsertPrecheckAccess',{email:qs('aEmail').value,role:qs('aRole').value,displayName:qs('aName').value,active:qs('aActive').checked});showToast('บันทึกสิทธิ์แล้ว');await load()}catch(e){showToast(e.message)}}
</script></body></html>
